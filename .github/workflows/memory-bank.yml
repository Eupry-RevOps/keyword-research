name: Memory bank contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  memory-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check startup and documentation contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          for file in AGENTS.md CLAUDE.md WORKFLOW.md memory-bank/toc.md memory-bank/activeContext.md memory-bank/projectbrief.md memory-bank/systemPatterns.md memory-bank/techContext.md memory-bank/progress.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed-files
          if ! grep -qvE '^(memory-bank/|\.github/workflows/memory-bank.yml$)' /tmp/changed-files; then
            exit 0
          fi
          grep -Fxq 'memory-bank/activeContext.md' /tmp/changed-files || { echo 'Update memory-bank/activeContext.md'; exit 1; }
          task_docs="$(grep -E '^memory-bank/tasks/[0-9]{4}-[0-9]{2}/[0-9]{6}_.+\.md$' /tmp/changed-files || true)"
          [[ -n "$task_docs" ]] || { echo 'Add or update a dated final task document'; exit 1; }
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            [[ "$path" == memory-bank/* ]] && continue
            if ! grep -Fq -- "$path" $task_docs; then
              echo "Document new file in task document: $path"
              exit 1
            fi
          done < <(git diff --name-only --diff-filter=A "$base" HEAD)
